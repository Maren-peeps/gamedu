<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dunia Blok Pintar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#a9dcff;--grid:#ffffff55;--card:#fff;--ink:#1b2a41;--g:#3fbf4a;--r:#e8503a;--y:#ffc928;--b:#2f8bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14233a;--grid:#ffffff14;--card:#22385a;--ink:#f2f7ff}}
:root[data-theme=dark]{--bg:#14233a;--grid:#ffffff14;--card:#22385a;--ink:#f2f7ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;background:linear-gradient(var(--grid) 2px,transparent 2px) 0 0/44px 44px,linear-gradient(90deg,var(--grid) 2px,transparent 2px) 0 0/44px 44px,var(--bg)}
.wrap{max-width:900px;margin:auto;padding:14px}
.top,.bar,.card{background:var(--card);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink)}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px}.top>div:nth-child(2){flex:1}
.av{position:relative;width:44px;height:52px}.av i{position:absolute;border:3px solid var(--ink)}
.hd{left:11px;top:0;width:22px;height:22px;background:var(--y)}.tr{left:4px;top:22px;width:36px;height:26px;background:var(--b)}
.coin{font-size:22px;font-weight:700}h1{font-size:26px;margin:22px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.tile{font:inherit;color:var(--ink);background:var(--card);border:4px solid var(--ink);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.tile:active,.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.em{font-size:46px;padding:10px;border-bottom:4px solid var(--ink)}.nm{padding:8px 6px 0;font-size:16px;font-weight:700}.st{color:#e59a00;padding-bottom:6px;font-size:20px}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:18px}.bar b{flex:1;text-align:center;font-size:18px}
.back,.opt{font:inherit;font-size:20px;color:#1b2a41;background:var(--y);border:4px solid var(--ink);border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.card{padding:18px;text-align:center}.prog{margin-bottom:10px}.pb{display:inline-block;width:38px;height:14px;border:3px solid var(--ink);background:#fff;margin:0 3px}.pb.d{background:var(--g)}.pb.n{background:var(--y)}
.q{font-size:clamp(26px,6vw,40px);font-weight:700;padding:18px 6px;line-height:1.25}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}.opt{padding:16px 8px;font-size:clamp(18px,4.5vw,26px);font-weight:700}
.opt.ok{background:var(--g);color:#fff}.opt.no{background:var(--r);color:#fff}
.fb{min-height:34px;font-size:22px;font-weight:700;margin-top:16px}
.lt{display:inline-block;width:42px;height:48px;line-height:42px;border:3px solid var(--ink);border-radius:8px;background:var(--y);color:#1b2a41;margin:3px;font-size:26px;font-weight:700}
.in{font:inherit;font-size:26px;text-align:center;text-transform:uppercase;padding:10px;border:4px solid var(--ink);border-radius:12px;width:100%;max-width:320px;background:var(--card);color:var(--ink);margin:14px 0}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:auto}
.cd{font:inherit;font-size:34px;aspect-ratio:1;color:#fff;background:var(--b);border:4px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer}.cd.f{background:#fff}.cd.m{background:var(--g)}
.big{font-size:60px;color:#e59a00;letter-spacing:6px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
</style></head><body><div class="wrap" id="app"></div>
<script>
let S={};try{S=JSON.parse(localStorage.getItem("bp")||"{}")}catch(e){}
S.c=S.c||0;S.s=S.s||{};
const save=()=>{try{localStorage.setItem("bp",JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app");
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const sh=a=>[...a].sort(()=>Math.random()-.5);
const rp=n=>"Rp"+n.toLocaleString("id-ID");
const num=(q,a,f=n=>String(n),st=1)=>{const o=new Set([a]);while(o.size<4){const d=R(-6,6),v=a+d*st;if(d&&v>=0)o.add(v)}return{q,a:f(a),o:sh([...o].map(f))}};
const gen=f=>()=>Array.from({length:5},f);
const bank=s=>()=>sh(s.trim().split("\n").map(r=>r.split(";"))).slice(0,5).map(r=>({q:r[0],a:r[1],o:sh(r.slice(1))}));
const hw=(l,a,b,c)=>[a,b,c].map(x=>x);
const eng=(e)=>{const rows=e.split(" ");return()=>sh(rows).slice(0,5).map(r=>{const[em,w]=r.split(":");const o=sh([w,...sh(rows.map(x=>x.split(":")[1]).filter(x=>x!==w)).slice(0,3)]);return{q:em+" = ?",a:w,o}})};

const games=[
{n:"Tambah Cepat",i:"➕",c:"#5aa9ff",m:gen(()=>{const a=R(10,99),b=R(10,99);return num(`${a} + ${b} = ?`,a+b)})},
{n:"Kurang Jago",i:"➖",c:"#5aa9ff",m:gen(()=>{const a=R(30,99),b=R(10,a-1);return num(`${a} − ${b} = ?`,a-b)})},
{n:"Kali Kilat",i:"✖️",c:"#5aa9ff",m:gen(()=>{const a=R(2,10),b=R(2,10);return num(`${a} × ${b} = ?`,a*b)})},
{n:"Bagi Bagi",i:"➗",c:"#5aa9ff",m:gen(()=>{const b=R(2,9),a=b*R(2,10);return num(`${a} ÷ ${b} = ?`,a/b)})},
{n:"Siapa Terbesar",i:"⚖️",c:"#5aa9ff",m:gen(()=>{const a=R(10,999);let b=R(10,999);if(a==b)b++;return{q:"Mana yang lebih besar?",a:String(Math.max(a,b)),o:[String(a),String(b)]}})},
{n:"Pola Angka",i:"🔢",c:"#5aa9ff",m:gen(()=>{const s=R(1,20),d=R(2,9);return num(`${s}, ${s+d}, ${s+2*d}, ${s+3*d}, … ?`,s+4*d)})},
{n:"Bangun Datar",i:"🔺",c:"#5aa9ff",m:bank(`Segitiga punya berapa sisi?;3;4;5
Persegi punya berapa sudut?;4;3;5
Bangun dengan 4 sisi sama panjang?;Persegi;Segitiga;Lingkaran
Bangun yang tidak punya sudut?;Lingkaran;Persegi;Segitiga
Segi enam punya berapa sisi?;6;5;8
Bangun dengan 3 sudut?;Segitiga;Persegi;Lingkaran
Persegi panjang punya berapa sisi?;4;3;6`)},
{n:"Genap Ganjil",i:"🎲",c:"#5aa9ff",m:gen(()=>{const g=R(0,1);const e=2*R(1,40);const od=()=>2*R(1,40)+1;const x=new Set();while(x.size<3)x.add(g?od():e+2*R(1,20)*(x.size+1)*0+2*R(1,40));const same=[...x].map(v=>g?v:v);const one=g?e:od();return{q:g?"Mana bilangan genap?":"Mana bilangan ganjil?",a:String(one),o:sh([one,...same].map(String))}})},
{n:"Uang Rupiah",i:"💵",c:"#5aa9ff",m:gen(()=>{const a=R(1,5),b=R(1,6);return num(`Ada ${a} uang Rp2.000 dan ${b} uang Rp500. Totalnya?`,a*2000+b*500,rp,500)})},
{n:"Ejaan Benar",i:"✏️",c:"#ff8a5c",m:bank(`Mana tulisan yang benar?;apotek;apotik;apotk
Mana tulisan yang benar?;kualitas;kwalitas;kualiteas
Mana tulisan yang benar?;risiko;resiko;risko
Mana tulisan yang benar?;nasihat;nasehat;nasihhat
Mana tulisan yang benar?;jadwal;jadual;jadwall
Mana tulisan yang benar?;sistem;sistim;sisthem
Mana tulisan yang benar?;izin;ijin;iziin`)},
{n:"Kata Mirip",i:"🤝",c:"#ff8a5c",m:bank(`Persamaan kata “cantik”?;indah;jelek;besar
Persamaan kata “pandai”?;pintar;malas;kecil
Persamaan kata “senang”?;gembira;sedih;marah
Persamaan kata “bohong”?;dusta;jujur;benar
Persamaan kata “kawan”?;teman;lawan;musuh
Persamaan kata “cepat”?;laju;lambat;pelan
Persamaan kata “besar”?;raya;mungil;sempit`)},
{n:"Lawan Kata",i:"↔️",c:"#ff8a5c",m:bank(`Lawan kata “tinggi”?;rendah;panjang;besar
Lawan kata “panas”?;dingin;hangat;basah
Lawan kata “rajin”?;malas;pintar;cepat
Lawan kata “naik”?;turun;maju;pergi
Lawan kata “terang”?;gelap;redup;silau
Lawan kata “jauh”?;dekat;lama;sempit
Lawan kata “kaya”?;miskin;sakit;kurus`)},
{n:"Susun Kata",i:"🔤",c:"#ff8a5c",t:1,m:()=>sh([["🐱","KUCING"],["🏫","SEKOLAH"],["📖","BUKU"],["🚲","SEPEDA"],["☀️","MATAHARI"],["✏️","PENSIL"],["🍌","PISANG"],["🐟","IKAN"]]).slice(0,5).map(r=>({q:r[0],a:r[1]}))},
{n:"Hewan Inggris",i:"🐘",c:"#b78cff",m:eng("🐶:Dog 🐟:Fish 🐘:Elephant 🐔:Chicken 🐸:Frog 🦁:Lion 🐰:Rabbit 🐱:Cat")},
{n:"Angka Warna",i:"🌈",c:"#b78cff",m:bank(`Bahasa Inggris “tiga”?;Three;Two;Five
Bahasa Inggris “merah”?;Red;Blue;Green
Bahasa Inggris “kuning”?;Yellow;Orange;Pink
Bahasa Inggris “sepuluh”?;Ten;Nine;Twelve
Bahasa Inggris “biru”?;Blue;Black;Red
Bahasa Inggris “lima”?;Five;Four;Six
Bahasa Inggris “hijau”?;Green;Gray;Brown`)},
{n:"Kebun Binatang",i:"🦒",c:"#46c970",m:bank(`Kucing makan daging, disebut?;Karnivora;Herbivora;Omnivora
Sapi makan rumput, disebut?;Herbivora;Karnivora;Omnivora
Ayam makan biji dan cacing, disebut?;Omnivora;Herbivora;Karnivora
Katak berkembang biak dengan?;Bertelur;Beranak;Membelah
Kucing berkembang biak dengan?;Beranak;Bertelur;Bertunas
Serangga punya berapa kaki?;6;4;8
Hewan pemakan tumbuhan?;Kambing;Harimau;Elang`)},
{n:"Sains Alam",i:"🔭",c:"#46c970",m:bank(`Planet tempat kita tinggal?;Bumi;Mars;Venus
Pusat tata surya?;Matahari;Bulan;Bumi
Air membeku menjadi?;Es;Uap;Embun
Tumbuhan membuat makanan lewat?;Fotosintesis;Respirasi;Penguapan
Alat pernapasan manusia?;Paru-paru;Jantung;Lambung
Berapa jumlah indra manusia?;5;4;6
Air berubah jadi uap karena?;Dipanaskan;Didinginkan;Dibekukan`)},
{n:"Jelajah Indonesia",i:"🗺️",c:"#ffc928",m:bank(`Ibu kota Jawa Barat?;Bandung;Bogor;Bekasi
Ibu kota Jawa Timur?;Surabaya;Malang;Kediri
Ibu kota Sumatera Utara?;Medan;Padang;Palembang
Gunung tertinggi di Indonesia?;Puncak Jaya;Semeru;Merapi
Candi Borobudur ada di provinsi?;Jawa Tengah;Jawa Barat;Bali
Lambang negara Indonesia?;Garuda;Elang;Harimau
Ibu kota Bali?;Denpasar;Kuta;Ubud`)},
{n:"Pancasila",i:"⭐",c:"#ffc928",m:bank(`Sila pertama Pancasila?;Ketuhanan Yang Maha Esa;Persatuan Indonesia;Keadilan sosial
Sila ketiga Pancasila?;Persatuan Indonesia;Kemanusiaan;Kerakyatan
Lambang sila kedua?;Rantai;Bintang;Pohon beringin
Semboyan negara kita?;Bhinneka Tunggal Ika;Tut Wuri Handayani;Merdeka
Hari Kemerdekaan RI?;17 Agustus;1 Juni;28 Oktober
Hari Sumpah Pemuda?;28 Oktober;17 Agustus;10 November
Lambang sila kelima?;Padi dan kapas;Banteng;Rantai`)},
{n:"Memory Blok",i:"🃏",c:"#ff6fa8",t:2}
];

let G,items,idx,ok,lock,mv;
const bar=t=>`<div class="bar"><button class="back" onclick="menu()">◀ Menu</button><b>${t}</b><span class="coin">🪙 ${S.c}</span></div>`;
function menu(){const lv=Math.floor(S.c/100)+1;
app.innerHTML=`<div class="top"><div class="av"><i class="hd"></i><i class="tr"></i></div><div><b style="font-size:20px">Pemain Hebat</b><div>Level ${lv}</div></div><div class="coin">🪙 ${S.c}</div></div><h1>Pilih dunia permainan</h1><div class="grid">${games.map((g,i)=>{const s=S.s[i]||0;return`<button class="tile" onclick="play(${i})"><div class="em" style="background:${g.c}">${g.i}</div><div class="nm">${i+1}. ${g.n}</div><div class="st">${"★".repeat(s)}${"☆".repeat(3-s)}</div></button>`}).join("")}</div>`;scrollTo(0,0)}
function play(i){G=i;const g=games[i];if(g.t==2)return mem();items=g.m();idx=0;ok=0;show()}
function show(){const g=games[G],it=items[idx];lock=0;
const pr=items.map((_,k)=>`<span class="pb ${k<idx?"d":k==idx?"n":""}"></span>`).join("");
let body;
if(g.t==1){const L=it.a.split("");let s;do{s=sh(L)}while(s.join("")==it.a);
body=`<div class="q">${it.q}</div><div>${s.map(c=>`<span class="lt">${c}</span>`).join("")}</div><input class="in" id="inp" autocomplete="off" placeholder="Ketik katanya"><div><button class="opt ok" onclick="chk()">Cek jawaban</button></div>`}
else body=`<div class="q">${it.q}</div><div class="opts">${it.o.map(o=>`<button class="opt" data-v="${o}" onclick="ans(this)">${o}</button>`).join("")}</div>`;
app.innerHTML=`${bar(g.i+" "+g.n)}<div class="card"><div class="prog">${pr}</div>${body}<div class="fb" id="fb"></div></div>`;
const inp=document.getElementById("inp");if(inp){inp.focus();inp.onkeydown=e=>{if(e.key=="Enter")chk()}}}
function done(right,a,btn){lock=1;if(right){ok++;S.c+=10;save()}
document.getElementById("fb").textContent=right?"Benar! 🎉 +10 koin":"Hampir! Jawabannya: "+a;
setTimeout(()=>{idx++;idx<items.length?show():fin()},right?900:1800)}
function ans(b){if(lock)return;const a=items[idx].a,right=b.dataset.v===a;b.classList.add(right?"ok":"no");
if(!right)[...document.querySelectorAll(".opt")].find(x=>x.dataset.v===a).classList.add("ok");done(right,a)}
function chk(){if(lock)return;const v=document.getElementById("inp").value.trim().toUpperCase();if(!v)return;done(v===items[idx].a,items[idx].a)}
function fin(){const st=ok>=5?3:ok>=4?2:ok>=3?1:0;result(st,`${ok} dari 5 benar`)}
function result(st,msg){S.s[G]=Math.max(S.s[G]||0,st);save();
app.innerHTML=`${bar(games[G].n)}<div class="card"><div class="big">${"★".repeat(st)}${"☆".repeat(3-st)}</div><div class="q">${st?"Kerja bagus!":"Ayo coba lagi!"}</div><div>${msg}</div><div class="btns"><button class="opt ok" onclick="play(${G})">Main lagi</button><button class="back" onclick="menu()">Ke menu</button></div></div>`}
function mem(){const e=["🐶","🐱","🐸","🦁","🍎","⚽","🚀","🌟"],c=sh([...e,...e]);let open=[],mt=0;mv=0;
app.innerHTML=`${bar("🃏 Memory Blok")}<div class="card"><div class="q" style="font-size:22px">Cari pasangan gambar yang sama</div><div class="mg">${c.map((x,i)=>`<button class="cd" data-i="${i}">?</button>`).join("")}</div><div class="fb" id="fb">Langkah: 0</div></div>`;
document.querySelectorAll(".cd").forEach(b=>b.onclick=()=>{if(lock||b.classList.contains("f")||b.classList.contains("m"))return;
b.textContent=c[b.dataset.i];b.classList.add("f");open.push(b);if(open.length<2)return;
mv++;document.getElementById("fb").textContent="Langkah: "+mv;const[x,y]=open;open=[];
if(x.textContent==y.textContent){x.className=y.className="cd m";if(++mt==8){S.c+=50;save();setTimeout(()=>result(mv<=12?3:mv<=18?2:1,`Selesai dalam ${mv} langkah! +50 koin`),600)}}
else{lock=1;setTimeout(()=>{[x,y].forEach(z=>{z.className="cd";z.textContent="?"});lock=0},700)}});lock=0}
menu();
</script></body></html>
